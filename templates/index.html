<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DistriLog — Operação Logística Integrada</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css?v=4.1.0">
  <script src="/static/goat_card_modal.js?v=4.0.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-panel">
      <div class="login-logo">DL</div>
      <h1>DISTRILOG</h1>
      <p>Produção, estoque, expedição e devoluções em um só lugar</p>
      <label>Usuário</label>
      <input id="loginUsername" autocomplete="username" onkeydown="if(event.key==='Enter'){event.preventDefault();doLogin();}">
      <label>Senha</label>
      <input id="loginPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();doLogin();}">
      <button class="primary full" onclick="doLogin()">Entrar</button>
      <div id="loginError" class="error-message"></div>
    </div>
  </section>

  <section id="passwordChangeScreen" class="login-screen hidden">
    <div class="login-panel">
      <div class="login-logo">DL</div>
      <h1>Defina sua senha</h1>
      <p>Troque a senha temporária antes de acessar o DISTRILOG.</p>
      <label>Nova senha (12+ caracteres, letras e números)</label>
      <input id="newLoginPassword" type="password" autocomplete="new-password">
      <label>Confirme a nova senha</label>
      <input id="confirmLoginPassword" type="password" autocomplete="new-password">
      <button class="primary full" onclick="submitFirstPasswordChange()">Salvar senha e entrar</button>
      <button class="secondary full" onclick="cancelFirstPasswordChange()">Cancelar</button>
      <div id="passwordChangeError" class="error-message"></div>
    </div>
  </section>
  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-logo">DL</div>
        <div><strong>DISTRILOG</strong></div>
      </div>
      <nav>
        <div class="nav-group">Operação</div>
        <button class="nav-item active" data-view="dashboard" onclick="goTo('dashboard')"><span class="nav-icon">⌂</span>Central de Operações</button>
        <button class="nav-item" data-view="mission" onclick="goTo('mission')"><span class="nav-icon">▤</span>Visão da Missão</button>
        <button class="nav-item" data-view="receiving" onclick="goTo('receiving')"><span class="nav-icon">▣</span>Recebimento</button>
        <button class="nav-item" data-view="quality" onclick="goTo('quality')"><span class="nav-icon">◇</span>Qualidade</button>
        <button class="nav-item" data-view="processing" onclick="goTo('processing-hub')"><span class="nav-icon">⚙</span>Processamento</button>
        <button class="nav-item" data-view="labeling" onclick="goTo('labeling')"><span class="nav-icon">♢</span>Etiquetagem</button>
        <button class="nav-item" data-view="storage-hub" onclick="goTo('storage-hub')"><span class="nav-icon">⌂</span>Estocagem</button>
        <button class="nav-item" data-view="address-map" onclick="goTo('address-map')"><span class="nav-icon">▦</span>Mapa de endereçamento</button>
        <div class="nav-group">Saída e retorno</div>
        <button class="nav-item" data-view="shipping" onclick="goTo('shipping')"><span class="nav-icon">♧</span>Expedição</button>
        <button class="nav-item" data-view="returns-hub" onclick="goTo('returns-hub')"><span class="nav-icon">↩</span>Devoluções</button>
        <div class="nav-group">Equipe</div>
        <button class="nav-item" data-view="chat" onclick="goTo('chat')"><span class="nav-icon">✉</span>Conversas<span id="chatNavBadge"></span></button>
        <button class="nav-item" data-view="calendar" onclick="goTo('calendar')"><span class="nav-icon">▤</span>Calendário</button>
        <button class="nav-item" data-view="cleaning" onclick="goTo('cleaning')"><span class="nav-icon">✦</span>Renata Ingrata</button>
        <div class="nav-group">Gestão</div>
        <button class="nav-item" data-view="registrations" onclick="goTo('registrations')"><span class="nav-icon">▦</span>Cadastros</button>
        <button class="nav-item hidden" id="testToolsNav" data-view="test" onclick="goTo('test')"><span class="nav-icon">⚗</span>Cards de teste</button>
      </nav>
      <div class="sidebar-footer">
        <div id="currentUser"></div>
        <label for="userLanguage" style="display:block;margin:8px 0 4px;font-size:12px">Idioma / Idioma</label>
        <select id="userLanguage" aria-label="Idioma da interface" onchange="changeUserLanguage(this.value)" style="width:100%;margin-bottom:8px"><option value="pt-BR">Português</option><option value="es">Español</option></select>
        <button onclick="logout()">Sair</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Recebimento, Qualidade e Processamento</p>
        </div>
        <div class="topbar-actions">
          <div class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Buscar (Ctrl + K)" onkeydown="globalSearchKey(event)"></div>
          <button class="top-icon" title="Atualizar" onclick="refreshCurrentView()">↻</button>
          <button class="top-icon" title="Ajuda" onclick="showQuickHelp()">?</button>
          <button class="top-icon" title="Sair" onclick="logout()">⇥</button>
          <span id="clock" class="hidden"></span>
        </div>
      </header>
      <section id="mainContent" class="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/collab.js?v=1.1.0"></script>
  <script src="/static/mission_history_2026.js?v=1.0.0"></script>
  <script src="/static/mission_weekly.js?v=1.1.0"></script>
  <script src="/static/mission.js?v=3.0.0"></script>
  <script src="/static/app.js?v=4.5.4"></script>
</body>
</html>
