name: DISTRILOG checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: distrilog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d distrilog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/distrilog_test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==8.3.4
      - name: Syntax check
        run: |
          python -m compileall -q .
          node --check static/app.js
          node --check static/mission.js
      - name: WMS unit checks
        run: python -m pytest tests -q
