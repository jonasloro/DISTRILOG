name: DISTRILOG Mobile Android APK (homologacao)
on:
  push:
    branches:
      - mobile-apk-homologacao
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-apk-homologacao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK assinado para teste
        working-directory: mobile-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar instalador
        shell: bash
        run: |
          set -euo pipefail
          apk=mobile-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$apk"
          cp "$apk" DISTRILOG-Mobile-Homologacao.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DISTRILOG-Mobile-Android-APK
          path: DISTRILOG-Mobile-Homologacao.apk
          if-no-files-found: error
          retention-days: 7
