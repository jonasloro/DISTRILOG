name: Stock 3D - Offline conversion toolkit
on:
  push:
    branches: [feature/stock-3d]
    paths: ['.github/workflows/stock3d-openskp-wheel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch MIT open source SKP parser wheel
        run: |
          python -m pip download --no-deps --dest ./wheelhouse 'openskp==1.3.0'
      - uses: actions/upload-artifact@v4
        with:
          name: Stock3D-OpenSKP-Python-Wheel
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7
