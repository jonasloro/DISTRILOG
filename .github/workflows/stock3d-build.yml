name: Stock 3D - Build experimental
on:
  push:
    branches: [feature/stock-3d, feature/stock3d-persistencia-e-localizacao, fix/stock3d-habilitar-salvar-modelo]
    paths:
      - 'stock3d/**'
      - '.github/workflows/stock3d-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: stock3d
        shell: bash
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Unit tests
        working-directory: stock3d
        run: npm test
      - name: Vite build
        working-directory: stock3d
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: DISTRILOG-Stock-3D-web
          path: stock3d/dist
          if-no-files-found: error
          retention-days: 7
      - name: Commit built frontend to experimental branch only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/stock3d
          rsync -a --delete stock3d/dist/ static/stock3d/
          git add -A static/stock3d stock3d/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(stock3d): publish verified frontend assets [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
