name: Stock 3D - Build experimental
on:
  push:
    branches: [feature/stock-3d]
    paths:
      - 'stock3d/**'
      - '.github/workflows/stock3d-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact frontend dependencies
        working-directory: stock3d
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: stock3d
        run: npm test
      - name: Vite build
        working-directory: stock3d
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: DISTRILOG-Stock-3D-web
          path: stock3d/dist
          if-no-files-found: error
          retention-days: 7
