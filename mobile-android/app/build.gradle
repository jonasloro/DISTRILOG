plugins {
    id 'com.android.application'
}
android {
    namespace 'com.distribox.distrilogmobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.distribox.distrilogmobile'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '0.7.0-homologacao'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
