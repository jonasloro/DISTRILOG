plugins { id 'com.android.application' }
android {
  namespace 'com.distribox.distrilogmobile.prototype'
  compileSdk 35
  defaultConfig {
    applicationId 'com.distribox.distrilogmobile.prototype'
    minSdk 24
    targetSdk 34
    versionCode 7
    versionName '1.6.0-piloto'
  }
  signingConfigs {
    if (System.getenv('MOBILE_SIGNING_KEYSTORE_PATH')) {
      company {
        storeFile file(System.getenv('MOBILE_SIGNING_KEYSTORE_PATH'))
        storePassword System.getenv('MOBILE_SIGNING_STORE_PASSWORD')
        keyAlias System.getenv('MOBILE_SIGNING_KEY_ALIAS')
        keyPassword System.getenv('MOBILE_SIGNING_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      if (System.getenv('MOBILE_SIGNING_KEYSTORE_PATH')) {
        signingConfig signingConfigs.company
      }
      minifyEnabled false
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  packaging {
    resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
  }
}
dependencies {
  implementation 'androidx.webkit:webkit:1.12.1'
  implementation 'androidx.core:core:1.13.1'
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
